<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Abstract illustration of digital forensics and cyber investigation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140525"/>
      <stop offset="0.5" stop-color="#2e0d48"/>
      <stop offset="1" stop-color="#1a0530"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a832d6" stop-opacity=".5"/>
      <stop offset="1" stop-color="#a832d6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f6a200" stop-opacity=".45"/>
      <stop offset="1" stop-color="#f6a200" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/><stop offset="1" stop-color="#f6a200"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="360" cy="300" r="340" fill="url(#halo)"/>
  <circle cx="980" cy="460" r="300" fill="url(#halo2)"/>
  <g opacity=".13" stroke="#ffffff"><path d="M0 180H1280M0 360H1280M0 540H1280M320 0V720M640 0V720M960 0V720"/></g>

  <!-- fingerprint arcs -->
  <g transform="translate(300 360)" fill="none" stroke="#f6a200" stroke-linecap="round" opacity=".8">
    <path d="M-96 26c-6-74 38-140 106-146 70-6 122 48 124 118" stroke-width="5" stroke-opacity=".8"/>
    <path d="M-70 34C-76-28-44-78 6-84c52-6 94 38 94 94" stroke-width="4" stroke-opacity=".55"/>
    <path d="M-44 40c-4-44 16-76 50-80 36-4 64 28 64 70" stroke-width="4" stroke-opacity=".4"/>
    <path d="M-16 44c-2-24 8-42 26-44 20-2 34 14 34 36" stroke-width="4" stroke-opacity=".3"/>
  </g>

  <!-- magnifier -->
  <g transform="translate(560 320)">
    <circle r="120" fill="url(#glass)" stroke="#ffd88a" stroke-width="4" stroke-opacity=".8"/>
    <circle r="96" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="2"/>
    <path d="M88 88l96 118" stroke="url(#amber)" stroke-width="22" stroke-linecap="round"/>
    <path d="M-52 6c8-40 40-64 78-58M-30 34c6-26 24-42 50-40" fill="none" stroke="#ffffff" stroke-opacity=".32" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="10" fill="#f6a200" filter="url(#soft)"/>
  </g>

  <!-- shield / chain of custody -->
  <g transform="translate(930 280)">
    <path d="M0-110l96 34v86c0 62-42 104-96 126-54-22-96-64-96-126v-86z" fill="url(#glass)" stroke="#f6a200" stroke-width="3" stroke-opacity=".8"/>
    <path d="M-44 4l30 32 60-72" fill="none" stroke="url(#amber)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#ffffff" opacity=".35"><circle cx="-70" cy="-60" r="5"/><circle cx="70" cy="-60" r="5"/><circle cx="0" cy="88" r="5"/></g>
  </g>

  <!-- evidence fragments + analytics -->
  <g transform="translate(870 520)">
    <rect width="280" height="130" rx="18" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".2"/>
    <g fill="#ffffff" opacity=".22">
      <rect x="24" y="86" width="22" height="24" rx="3"/><rect x="58" y="66" width="22" height="44" rx="3"/>
      <rect x="92" y="44" width="22" height="66" rx="3"/><rect x="126" y="72" width="22" height="38" rx="3"/>
      <rect x="160" y="30" width="22" height="80" rx="3"/>
    </g>
    <rect x="194" y="18" width="22" height="92" rx="3" fill="url(#amber)"/>
    <path d="M24 34l40-8 34 6 42-18 34 6" fill="none" stroke="#f6a200" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- dotted evidence trail -->
  <g fill="#ffd88a" opacity=".7">
    <circle cx="160" cy="180" r="5"/><circle cx="220" cy="140" r="4"/><circle cx="290" cy="118" r="5"/>
    <circle cx="1080" cy="180" r="5"/><circle cx="1140" cy="220" r="4"/><circle cx="1180" cy="280" r="5"/>
  </g>
  <g stroke="#ffd88a" stroke-opacity=".3" stroke-width="2" fill="none">
    <path d="M160 180l60-40 70-22M1080 180l60 40 40 60"/>
  </g>
</svg>
