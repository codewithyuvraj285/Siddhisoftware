<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Abstract illustration of emerging technology trends">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#160626"/>
      <stop offset="0.55" stop-color="#34104f"/>
      <stop offset="1" stop-color="#1a0530"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f6a200" stop-opacity=".55"/>
      <stop offset="1" stop-color="#f6a200" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c14be0" stop-opacity=".5"/>
      <stop offset="1" stop-color="#c14be0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".03"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f6a200"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="250" cy="180" r="300" fill="url(#glowB)"/>
  <circle cx="1030" cy="560" r="340" fill="url(#glowA)"/>
  <g opacity=".16" stroke="#ffffff" stroke-width="1">
    <path d="M0 120H1280M0 240H1280M0 360H1280M0 480H1280M0 600H1280"/>
    <path d="M160 0V720M320 0V720M480 0V720M640 0V720M800 0V720M960 0V720M1120 0V720"/>
  </g>

  <!-- orbital rings -->
  <g fill="none" transform="translate(930 330)">
    <ellipse rx="250" ry="105" stroke="#ffc766" stroke-opacity=".45" stroke-width="2" transform="rotate(-22)"/>
    <ellipse rx="210" ry="88" stroke="#ffffff" stroke-opacity=".22" stroke-width="1.5" transform="rotate(28)"/>
    <circle r="150" stroke="#ffffff" stroke-opacity=".12" stroke-dasharray="6 12"/>
    <circle cx="238" cy="-92" r="9" fill="#f6a200" filter="url(#soft)"/>
    <circle cx="-196" cy="74" r="6" fill="#ffffff" opacity=".7"/>
  </g>

  <!-- central chip -->
  <g transform="translate(635 350)">
    <rect x="-118" y="-118" width="236" height="236" rx="38" fill="url(#panel)" stroke="#ffcf7a" stroke-opacity=".5" stroke-width="2"/>
    <rect x="-82" y="-82" width="164" height="164" rx="26" fill="#170a2a" stroke="#f6a200" stroke-opacity=".7" stroke-width="2"/>
    <path d="M-52-30h34l18-26 18 26h34M-52 12h34l18 26 18-26h34M-52 46h104" fill="none" stroke="url(#amber)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g stroke="#f6a200" stroke-width="3" stroke-linecap="round" opacity=".8">
      <path d="M-118-70h-34M-118 0h-44M-118 70h-34M118-70h34M118 0h44M118 70h34M-70-118v-34M0-118v-44M70-118v-34M-70 118v34M0 118v44M70 118v34"/>
    </g>
    <circle r="14" fill="#f6a200" filter="url(#soft)"/>
  </g>

  <!-- floating panels -->
  <g transform="translate(150 260)">
    <rect width="270" height="150" rx="18" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".22"/>
    <circle cx="36" cy="38" r="9" fill="#f6a200"/>
    <rect x="56" y="32" width="120" height="12" rx="6" fill="#ffffff" opacity=".35"/>
    <rect x="24" y="72" width="180" height="8" rx="4" fill="#ffffff" opacity=".18"/>
    <rect x="24" y="94" width="140" height="8" rx="4" fill="#ffffff" opacity=".18"/>
    <rect x="24" y="116" width="90" height="8" rx="4" fill="#f6a200" opacity=".65"/>
  </g>
  <g transform="translate(880 470)">
    <rect width="250" height="140" rx="18" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".22"/>
    <g fill="#ffffff" opacity=".25">
      <rect x="26" y="92" width="24" height="28" rx="4"/>
      <rect x="62" y="70" width="24" height="50" rx="4"/>
      <rect x="98" y="48" width="24" height="72" rx="4"/>
    </g>
    <rect x="134" y="30" width="24" height="90" rx="4" fill="url(#amber)"/>
    <rect x="170" y="58" width="24" height="62" rx="4" fill="#ffffff" opacity=".35"/>
    <path d="M26 42l40-14 36 10 44-22 34 8" fill="none" stroke="#f6a200" stroke-width="3" stroke-linecap="round" opacity=".9"/>
  </g>

  <!-- connectivity -->
  <g fill="none" stroke="#ffd88a" stroke-opacity=".35" stroke-width="1.5">
    <path d="M420 335C500 300 520 320 535 340M760 360c80 20 100 70 130 110M420 335c-90-30-140-20-190-20"/>
  </g>
  <g fill="#ffd88a" opacity=".85">
    <circle cx="420" cy="335" r="5"/><circle cx="760" cy="360" r="5"/><circle cx="230" cy="315" r="5"/><circle cx="890" cy="470" r="5"/>
  </g>
</svg>
